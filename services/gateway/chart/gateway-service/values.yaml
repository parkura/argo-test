app: gateway-service
image:
  registry: ghcr.io/parkura
  name: shared-backend
  # tag stays null: the deployment falls back to .Chart.AppVersion,
  # which CI stamps with the image tag built in the same run
  tag: null
replicas: 2
peers: [order-service, inventory-service]
# gateway restarts only after order/inventory are healthy
syncWave: "1"
