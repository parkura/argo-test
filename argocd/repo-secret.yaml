# Registers ghcr as a Helm OCI repository for Argo CD.
# Packages must be PUBLIC on ghcr for this credential-less form to work
# (ghcr packages are private by default even in a public repo — flip them
# after the first CI run: package settings → Change visibility).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-helm-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: ghcr-helm-charts
  type: helm
  url: ghcr.io/parkura/helm-charts
  enableOCI: "true"
