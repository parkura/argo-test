# All backend services in ONE Application (multi-source: one OCI chart per
# service) so a single sync applies every backend Deployment at the same
# moment; sync waves order resources within it (gateway on wave 1 restarts
# after its peers are healthy).
#
# NOTE: this file is the bootstrap/reference copy. On every release the
# workflow REGENERATES the sources list from services/*/chart/* and
# kubectl-applies the result — adding/removing a service directory in the
# repo adds/removes it here automatically (prune deletes removed services'
# resources). That re-apply also resets any manual pins or auto-sync
# toggles: a new release supersedes all manual holds.
#
# targetRevision "*" = newest stable semver, ANY major/minor — CI can
# change its versioning scheme without touching this spec. Prereleases
# (1.0.9-test) are still excluded.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  labels:
    service-group: graphql
spec:
  project: default
  sources:
    - repoURL: ghcr.io/parkura/helm-charts
      chart: order-service
      targetRevision: "*"
    - repoURL: ghcr.io/parkura/helm-charts
      chart: inventory-service
      targetRevision: "*"
    - repoURL: ghcr.io/parkura/helm-charts
      chart: gateway-service
      targetRevision: "*"
  destination:
    server: https://kubernetes.default.svc
    namespace: sim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
