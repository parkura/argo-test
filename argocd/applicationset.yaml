# One ApplicationSet for ALL deployables, discovered from the repo tree —
# the git directory generator scans this repo on main and stamps out one
# Application per chart directory. Adding/removing a service directory
# adds/removes its Application automatically (cascade deletes its
# resources); nobody maintains a service list anywhere.
#
# targetRevision "*" = newest stable semver, any major — CI's versioning
# scheme never requires spec edits (prereleases excluded).
#
# ignoreApplicationDifferences keeps the appset controller from stamping
# over MANUAL operations on generated apps: without it, a UI rollback
# (which disables auto-sync) or a targetRevision pin would be reverted on
# the next appset reconcile (~minutes). With it, manual holds persist
# until a human clears them — there is no CI re-apply in this model, so
# holds are durable; pinned apps need periodic review.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sim-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # element removed on purpose (service deleted from repo) should clean
    # up its resources — cascade is the desired behavior here
    preserveResourcesOnDeletion: false
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
        - /spec/source/targetRevision
  generators:
    - git:
        repoURL: https://github.com/parkura/argo-test.git
        revision: main
        directories:
          - path: services/*/chart/*
          - path: apps/*/chart/*
          - path: crons/*/chart/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        # first path segment: services / apps / crons
        service-group: "{{ index .path.segments 0 }}"
    spec:
      project: default
      source:
        repoURL: ghcr.io/parkura/helm-charts
        chart: "{{ .path.basename }}"
        targetRevision: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: sim
      # live operational edits survive auto-sync/selfHeal: any Deployment
      # field last set by a manual tool (kubectl scale/edit/patch, k9s,
      # headlamp) is ignored when diffing, and RespectIgnoreDifferences
      # keeps syncs from overwriting it. Fields never hand-touched keep
      # following the chart — so chart-driven changes still deploy.
      # ops-owned FIELDS on workload kinds: replicas and container
      # resources belong to operators (any tool — kubectl, Headlamp, …),
      # everything else follows the chart. Field-based ignores are
      # tool-agnostic and reliably respected at sync time, unlike
      # managedFieldsManagers matching (exact manager-name strings,
      # not honored by client-side apply on write).
      # Trade-off: chart changes to THESE fields no longer deploy.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
          jqPathExpressions:
            - .spec.template.spec.containers[].resources
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
