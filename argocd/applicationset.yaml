# One ApplicationSet for ALL deployables, discovered from the repo tree —
# the git directory generator scans this repo on main and stamps out one
# Application per chart directory. Adding/removing a service directory
# adds/removes its Application automatically (cascade deletes its
# resources); nobody maintains a service list anywhere.
#
# targetRevision "*" = newest stable semver, any major — CI's versioning
# scheme never requires spec edits (prereleases excluded).
#
# ignoreApplicationDifferences keeps the appset controller from stamping
# over MANUAL operations on generated apps: without it, a UI rollback
# (which disables auto-sync) or a targetRevision pin would be reverted on
# the next appset reconcile (~minutes). With it, manual holds persist
# until a human clears them — there is no CI re-apply in this model, so
# holds are durable; pinned apps need periodic review.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sim-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # element removed on purpose (service deleted from repo) should clean
    # up its resources — cascade is the desired behavior here
    preserveResourcesOnDeletion: false
  ignoreApplicationDifferences:
    # ONLY the hold-related knobs: the automated toggle (UI rollbacks
    # disable it) and version pins. Everything else under syncPolicy
    # (syncOptions, retry) must keep reconciling from this template —
    # ignoring all of /spec/syncPolicy blocks template updates like
    # RespectIgnoreDifferences from ever reaching existing apps.
    - jsonPointers:
        - /spec/syncPolicy/automated
        - /spec/source/targetRevision
        # helm parameter overrides (argocd app set -p) are manual holds
        # too — e.g. pinning one subchart's image.tag inside the backend
        # umbrella; without this the appset stomps them within minutes
        - /spec/source/helm
  generators:
    - git:
        repoURL: https://github.com/parkura/argo-test.git
        revision: main
        directories:
          # backend services deploy as ONE app (umbrella chart) — the
          # tier is built/tested/versioned as a unit, so it rolls back
          # as a unit; services/*/chart/* are its subcharts, not apps
          - path: backend/chart/*
          - path: apps/*/chart/*
          - path: crons/*/chart/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        # first path segment: services / apps / crons
        service-group: "{{ index .path.segments 0 }}"
    spec:
      project: default
      source:
        repoURL: ghcr.io/parkura/helm-charts
        chart: "{{ .path.basename }}"
        targetRevision: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: sim
      # ops-owned fields: replicas and container resources on Deployments
      # belong to operators — live edits from any tool (kubectl, Headlamp,
      # …) survive auto-sync/selfHeal. Everything else follows the chart
      # and hand-edits to it revert within seconds. Requires the
      # RespectIgnoreDifferences sync option below.
      # Trade-off: chart changes to these two fields no longer deploy.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
          jqPathExpressions:
            - .spec.template.spec.containers[].resources
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
