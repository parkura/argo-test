# One ApplicationSet for all deployables.
#
# `targetRevision: "*"` (newest stable, any major) re-resolves to the newest chart version on
# refresh; deploys are manual syncs (UI or argocd CLI).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sim-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # removing an element deletes its Application but ORPHANS the deployed
    # resources instead of cascading — no pod deletion on regrouping
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          # backend services are NOT here — they deploy together as one
          # multi-source Application (backend-app.yaml) so their rolling
          # restarts are synchronized
          # ---- 2 frontends ----
          - { name: web-app, group: frontend }
          - { name: admin-app, group: frontend }
          # ---- 1 cron ----
          - { name: ticker-cron, group: cronjob }
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        service-group: "{{ .group }}"
    spec:
      project: default
      source:
        repoURL: ghcr.io/parkura/helm-charts
        chart: "{{ .name }}"
        targetRevision: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: sim
      syncPolicy:
        # fully hands-off: when 1.0.* resolves to a new chart version,
        # Argo deploys it without a manual sync
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
