# CI/CD — Helm OCI charts to ghcr + images, no git write-back.
#
# Per push to main:
#   1. version — one chart version + one image tag for the run
#   2. shared-backend built once (serves order/inventory/gateway services)
#      + independent images for the 2 frontends and the cron (matrix)
#   3. charts packaged with --version/--app-version and pushed to
#      oci://ghcr.io/<owner>/helm-charts — the backend services as ONE
#      umbrella chart ("backend", subcharts vendored from the tree),
#      frontends and cron as individual charts
#
# VERSIONING RULE (load-bearing): chart --version must be PLAIN semver
# (1.0.<run>). Argo's `targetRevision: 1.0.*` excludes prerelease versions
# like 1.0.42-abc1234 — the sha suffix goes on the IMAGE tag only.
#
# No argocd sync job: Argo polls the registry itself (reconciliation
# interval set to 15s in argocd-cm) and flags apps OutOfSync when a new
# 1.0.x chart appears; deploys are manual syncs from the UI or CLI.

name: ci-cd-oci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.v.outputs.chart_version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - id: v
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "chart_version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=1.0.${{ github.run_number }}-${short_sha}" >> "$GITHUB_OUTPUT"
          # ghcr requires a lowercase owner
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  shared-backend-image:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push shared backend image (one image, 3 services)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfiles/backend.Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.image_tag }}
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/shared-backend:${{ needs.version.outputs.image_tag }}

  independent-images:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web-app, dockerfile: Dockerfiles/frontend.Dockerfile }
          - { name: admin-app, dockerfile: Dockerfiles/frontend.Dockerfile }
          - { name: ticker-cron, dockerfile: Dockerfiles/cron.Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.image_tag }}
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/${{ matrix.name }}:${{ needs.version.outputs.image_tag }}

  charts:
    runs-on: ubuntu-latest
    needs: [version, shared-backend-image, independent-images]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm registry login (ghcr OCI)
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push all charts
        env:
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
          APP_VERSION: ${{ needs.version.outputs.image_tag }}
          OWNER: ${{ needs.version.outputs.owner }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Backend services ship as ONE umbrella chart: subcharts are
          # discovered from the tree, so adding/removing a service
          # directory is the only step needed to change the fleet.
          #
          # Subchart appVersion must be stamped in place (not via
          # --app-version, which only reaches the umbrella): the
          # deployment templates fall back to .Chart.AppVersion for the
          # image tag, and .Chart inside a subchart is the SUBchart.
          for c in services/*/chart/*/Chart.yaml; do
            sed -i "s/^appVersion: .*/appVersion: \"$APP_VERSION\"/" "$c"
          done
          {
            echo "dependencies:"
            for d in services/*/chart/*/; do
              echo "  - name: $(basename "$d")"
              echo "    version: \"0.0.0\""
              echo "    repository: \"file://../../../$d\""
            done
          } >> backend/chart/backend/Chart.yaml
          helm dependency update backend/chart/backend

          for chart in backend/chart/*/ apps/*/chart/*/ crons/*/chart/*/; do
            helm package "$chart" \
              --version "$CHART_VERSION" \
              --app-version "$APP_VERSION" \
              --destination dist
          done
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/$OWNER/helm-charts"
          done
          echo "Pushed $(ls dist | wc -l) charts at version $CHART_VERSION (appVersion $APP_VERSION)"

  # A release supersedes all manual holds: UI rollbacks (auto-sync
  # disabled) and version pins survive BETWEEN releases (the appset's
  # ignoreApplicationDifferences protects them), and this job clears
  # them when the next version ships — every app returns to floating
  # "*" + automated, so the fleet converges on the new release.
  #
  # Self-hosted because the kind cluster only exists on the laptop; in a
  # real setup this is ubuntu-latest + azure/login (OIDC) + AKS creds.
  reset-holds:
    runs-on: self-hosted
    needs: charts
    steps:
      - name: Re-enable auto-sync and unpin all generated apps
        run: |
          set -euo pipefail
          for app in $(kubectl --context kind-gitops-sim -n argocd get applications \
                        -l service-group -o name); do
            kubectl --context kind-gitops-sim -n argocd patch "$app" --type merge -p '{
              "spec": {
                "source": {"targetRevision": "*"},
                "syncPolicy": {"automated": {"prune": true, "selfHeal": true}}
              }
            }'
          done
