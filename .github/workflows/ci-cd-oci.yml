# CI/CD — Helm OCI charts to ghcr + images, no git write-back.
#
# Per push to main:
#   1. version — one chart version + one image tag for the run
#   2. shared-backend built once (serves order/inventory/gateway services)
#      + independent images for the 2 frontends and the cron (matrix)
#   3. all 6 charts packaged with --version/--app-version and pushed to
#      oci://ghcr.io/<owner>/helm-charts
#
# VERSIONING RULE (load-bearing): chart --version must be PLAIN semver
# (1.0.<run>). Argo's `targetRevision: 1.0.*` excludes prerelease versions
# like 1.0.42-abc1234 — the sha suffix goes on the IMAGE tag only.
#
# No argocd sync job here: GitHub runners can't reach the local kind
# cluster. Argo's ~3 min polling picks up the new chart versions; sync
# manually from the UI or CLI.

name: ci-cd-oci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.v.outputs.chart_version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - id: v
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "chart_version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=1.0.${{ github.run_number }}-${short_sha}" >> "$GITHUB_OUTPUT"
          # ghcr requires a lowercase owner
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  shared-backend-image:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push shared backend image (one image, 3 services)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfiles/backend.Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.image_tag }}
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/shared-backend:${{ needs.version.outputs.image_tag }}

  independent-images:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web-app, dockerfile: Dockerfiles/frontend.Dockerfile }
          - { name: admin-app, dockerfile: Dockerfiles/frontend.Dockerfile }
          - { name: ticker-cron, dockerfile: Dockerfiles/cron.Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.image_tag }}
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/${{ matrix.name }}:${{ needs.version.outputs.image_tag }}

  charts:
    runs-on: ubuntu-latest
    needs: [version, shared-backend-image, independent-images]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm registry login (ghcr OCI)
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push all charts
        env:
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
          APP_VERSION: ${{ needs.version.outputs.image_tag }}
          OWNER: ${{ needs.version.outputs.owner }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for chart in services/*/chart/*/ apps/*/chart/*/ crons/*/chart/*/; do
            helm package "$chart" \
              --version "$CHART_VERSION" \
              --app-version "$APP_VERSION" \
              --destination dist
          done
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/$OWNER/helm-charts"
          done
          echo "Pushed $(ls dist | wc -l) charts at version $CHART_VERSION (appVersion $APP_VERSION)"

  # Runs on the self-hosted runner (same machine as the kind cluster).
  # --core mode talks to the cluster through the kubeconfig directly —
  # no argocd-server login, no token secret. The kube context is pinned
  # so the job can never act on any other cluster in the kubeconfig.
  sync:
    runs-on: self-hosted
    needs: charts
    env:
      ARGOCD_OPTS: --core --kube-context kind-gitops-sim
    steps:
      - name: Batch-sync backend service group
        run: |
          set -euo pipefail
          # hard refresh: re-resolve 1.0.* against ghcr NOW, not on the
          # next polling cycle
          argocd app list -l service-group=graphql -o name \
            | xargs -r -n 1 argocd app get --hard-refresh > /dev/null
          argocd app sync -l service-group=graphql --async

      - name: Sync frontends and cron
        run: |
          set -euo pipefail
          for group in frontend cronjob; do
            argocd app list -l "service-group=$group" -o name \
              | xargs -r -n 1 argocd app get --hard-refresh > /dev/null
            argocd app sync -l "service-group=$group" --async
          done
