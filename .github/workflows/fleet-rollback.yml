# One-click rollback from the GitHub UI (Actions → fleet-rollback → Run
# workflow).
#
#   scope:    all | services | apps | crons  (label-based groups)
#             single  (one app — set the `app` input)
#   app:      app name, used only when scope=single (e.g. gateway-service)
#   revision: explicit chart version (e.g. 1.0.12) — the image follows the
#             chart automatically (each chart's appVersion is the image tag
#             built in the same run). Leave EMPTY to use each app's own
#             previous deployed revision from its Argo history.
#
# Semantics under release-supersedes: auto-sync stays ON and enforces the
# pin (apps go green on the old version); the pin survives until the next
# release, when reset-holds clears it. A permanent rollback = git revert
# of the bad commit, for which this buys time.
#
# Self-hosted for the same reason as reset-holds: the kind cluster only
# exists on the laptop. In a real setup: ubuntu-latest + OIDC + AKS.
name: fleet-rollback

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to roll back"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - services
          - apps
          - crons
          - single
      app:
        description: "App name (only used when scope=single)"
        required: false
        default: ""
      revision:
        description: "Chart version to pin (empty = each app's previous deployed revision)"
        required: false
        default: ""

jobs:
  rollback:
    runs-on: self-hosted
    steps:
      - name: Resolve targets and pin
        env:
          SCOPE: ${{ inputs.scope }}
          APP: ${{ inputs.app }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          kc="kubectl --context kind-gitops-sim -n argocd"

          case "$SCOPE" in
            all)
              apps=$($kc get applications -l service-group -o jsonpath='{.items[*].metadata.name}')
              ;;
            services|apps|crons)
              apps=$($kc get applications -l "service-group=$SCOPE" -o jsonpath='{.items[*].metadata.name}')
              ;;
            single)
              if [ -z "$APP" ]; then
                echo "::error::scope=single requires the app input"; exit 1
              fi
              apps="$APP"
              ;;
          esac

          if [ -z "$apps" ]; then
            echo "::error::no applications matched scope=$SCOPE"; exit 1
          fi
          echo "targets: $apps"

          for app in $apps; do
            rev="$REVISION"
            if [ -z "$rev" ]; then
              # second-to-last entry in the app's own deploy history
              rev=$($kc get application "$app" \
                -o jsonpath='{.status.history[*].revision}' | awk 'NF>1{print $(NF-1)}')
            fi
            if [ -z "$rev" ]; then
              echo "::warning::$app has no previous revision in history — skipped"
              continue
            fi
            $kc patch application "$app" --type merge \
              -p "{\"spec\":{\"source\":{\"targetRevision\":\"$rev\"}}}"
            echo "$app pinned to $rev"
          done